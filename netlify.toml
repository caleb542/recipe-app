# netlify.toml - NO CACHE VERSION FOR DEBUGGING

[build.environment]
SECRETS_SCAN_OMIT_KEYS = "AUTH0_CLIENT_ID,AUTH0_DOMAIN"

[dev]
command = "npm run dev"
targetPort = 8888
port = 8080
functions = "netlify/functions"
autoLaunch = false
framework = "#static" 


[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["mongodb"]

[build]
publish = "public"
command = "npm run build"

