# netlify.toml - Recipe Me Configuration

[build.environment]
SECRETS_SCAN_OMIT_KEYS = "AUTH0_CLIENT_ID,AUTH0_DOMAIN"

[dev]
command = "npm run dev"
targetPort = 8888
port = 8080
functions = "netlify/functions"
autoLaunch = false
framework = "#static" 

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["mongodb"]

[build]
publish = "public"
command = "npm run build"


# ========================================
# AUTH0 CALLBACK - Must be first
# ========================================

[[redirects]]
  from = "/callback"
  to = "/callback.html"
  status = 200
  force = true


# ========================================
# PROFILE PAGES
# ========================================

[[redirects]]
  from = "/@:username"
  to = "/profile.html?username=:username"
  status = 200
  force = false


