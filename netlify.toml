# netlify.toml - Recipe Me Configuration

[build.environment]
SECRETS_SCAN_OMIT_KEYS = "AUTH0_CLIENT_ID,AUTH0_DOMAIN"

[dev]
command = "npm run dev"
targetPort = 8888
port = 8080
functions = "netlify/functions"
autoLaunch = false
framework = "#static" 

[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
external_node_modules = ["mongodb"]

[build]
publish = "public"
command = "npm run build"


# ========================================
# AUTH0 CALLBACK - Must be first
# ========================================

[[redirects]]
  from = "/callback"
  to = "/callback.html"
  status = 200
  force = true


# ========================================
# PROFILE PAGES
# ========================================

[[redirects]]
  from = "/@:username"
  to = "/profile.html?username=:username"
  status = 200
  force = false

# ========================================
# RECIPE PAGES (Username-based slugs)
# These come AFTER categories
# ========================================
# ========================================
# CATEGORIES PAGE
# ========================================

[[redirects]]
  from = "/categories"
  to = "/categories.html"
  status = 200
  force = false
  
[[redirects]]
  from = "/category/:slug"
  to = "/category.html?category=:slug"
  status = 200

# ========================================
# RECIPE PAGES (Username-based slugs)
# These come AFTER categories
# ========================================

[[redirects]]
  from = "/article/:slug"
  to = "/article.html?slug=:slug"
  status = 200
  force = false

#[[redirects]]
#  from = "/@:username/:slug/edit"
#  to = "/edit.html?slug=:slug"
#  status = 200
#  force = false

# Legacy support for /@username/slug format
[[redirects]]
  from = "/@:username/:slug"
  to = "/article.html?slug=:slug"
  status = 200
  force = false


# ========================================
# FALLBACK - Removed the /* catch-all
# Let 404s be 404s
# ========================================