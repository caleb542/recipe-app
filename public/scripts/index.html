    <title>Recipe Me</title>

</head>

<body class="home-page homepage">
       <div id="spinner-container">
          
                 <div class="spinner">
                        <span></span>
                        <span></span>
                        <span></span>
                </div>
                <!-- <i class="fa fa-spinner fa-spin"></i> -->
                <p>Loading...</p>
            </div>

    <!-- Splash Page -->
    <div id="static-landing-page" class="splash-overlay">
        <div id="wheel-a" class="spinning-wheel">
            <i class="fas fa-pepper-hot"></i>
            <i class="fas fa-cheese"></i>
            <i class="fas fa-hamburger"></i>
            <i class="fas fa-drumstick-bite"></i>
            <i class="fas fa-bread-slice"></i>
            <i class="fas fa-pizza-slice"></i>
            <i class="fas fa-hotdog"></i>
            <i class="fas fa-ice-cream"></i>
        </div>
        <div id="wheel-b" class="spinning-wheel">
            <i class="fas fa-cheese"></i>
            <i class="fas fa-ice-cream"></i>
            <i class="fas fa-bread-slice"></i>
            <i class="fas fa-pizza-slice"></i>
            <i class="fas fa-hamburger"></i>
            <i class="fas fa-pepper-hot"></i>
            <i class="fas fa-hotdog"></i>
            <i class="fas fa-drumstick-bite"></i>
            <i class="fas fa-pepper-hot small"></i>
        </div>
        <div id="wheel-c" class="spinning-wheel">
            <i class="fas fa-hamburger"></i>
            <i class="fas fa-cheese"></i>
            <i class="fas fa-pizza-slice"></i>
            <i class="fas fa-hotdog"></i>
            <i class="fas fa-pepper-hot"></i>
            <i class="fas fa-ice-cream"></i>
            <i class="fas fa-bread-slice"></i>
            <i class="fas fa-drumstick-bite"></i>              
        </div>
        <!-- Splash page center text -->
        <div class="centered-title">
            <div class="splash-content">
                <h1 class="splash-logo">RECIPE ME</h1>
                <p class="splash-tagline">Publish your recipes to the web</p>
                <div class="splash-actions">
                    <button id="browse-btn" class="btn-primary .stl-cta">Browse Recipes</button>
                    <button id="splash-login-btn" class="btn-secondary">Login to Create</button>
                </div>
            </div>
        </div>
    </div><!-- End splash page -->

    <div class="page-container">
        <!-- Header loaded from partial (2-tier navigation) -->
        <header></header>
        
        <main id="main-content" class="content-wrap">
            <!-- HERO -->
             <div class="homepage-hero">
                <div class="homepage-hero-image">
                    <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=800&q=80" alt="Beautiful food">
                </div>
                <div class="homepage-hero-content">
                    <p class="homepage-hero-eyebrow">Welcome to Recipe Me</p>
                    <h1 class="homepage-hero-title">
                    Good food,<br>
                    <em>well made.</em>
                    </h1>
                    <p class="homepage-hero-body">
                    Recipes worth cooking — from people who genuinely love to     cook. 
                    No ads, no clutter, no life stories before the ingredients.
                    </p>
                     <a href="#curated-sections" class="homepage-hero-cta">Explore Categories</a>
                    <a href="#all-recipes" class="homepage-hero-cta inverted-hero-cta">All Recipes</a>
                </div>
            </div>  
             <!-- Sections -->
            <div id="curated-sections"></div>
            <!-- All Recipes section -->
            <div id="all-recipes" class="all-recipes-header">
            <h2 >All Recipes</h2>
            </div>
            <!-- Sort Bar -->
            <div class="sort-bar">
                <div class="sort-controls">
                     <!-- Search bar - only visible on homepage -->
                    <div class="search-control">
                        <i class="fa fa-search search-icon"></i>
                        <input size="40" type="text" id="search-filter" placeholder="Filter All Recipes" aria-label="Search recipes">
                    </div>
                    <div class="sort-control">
                        <label for="filter-by">Sort:</label>
                        <select id="filter-by">
                            <option value="byEdited">Last modified</option>
                            <option value="byCreated">Created date</option>
                            <option value="alphabetical">Alphabetical</option>
                        </select>
                    </div>
                    
                </div>
                <!-- <a href="/edit.html" class="btn-primary btn-sm">
                    <i class="fa fa-plus"></i> Add Recipe
                </a> -->
            </div>
            
            <!-- Recipe Grid -->
            <div class="container">
                <div id="recipes" class="cards"></div>
            </div>
        </main>
       
        <div id="footer-container"></div>
        <div id="nav-overlay" class="nav-overlay"></div>
    </div>

    <script type="module" src="/scripts/index-bundle.js"></script>
