<template class="article-template" id="article-template">
    <article class="recipe-article">
        <div class="hero">
            <div class="hero-text">
                 <h2 class="article__title"></h2>
                <!-- Rating -->
                <p class="author"></p>
                <div id="rating-display"></div>
                <p class="description summary"></p> 
            </div> 
           
   <div class="recipe-gallery" role="region" aria-label="Recipe photos">

    <div class="recipe-gallery__figures overflow-scroller" 
         role="group" 
         tabindex="0"
         aria-label="Recipe photos">
    </div>

    <figcaption class="recipe-gallery__caption" aria-live="polite"></figcaption>

    <div class="recipe-gallery__bar" hidden>
        <span class="recipe-gallery__counter" aria-live="polite"></span>
        <div class="recipe-gallery__lines" role="group" aria-label="Photo navigation"></div>
    </div>

</div>
        </div>
        <div class="article-block">
          
            <section class="article-meta">
                <div class="meta-icons">
                    <!-- Date -->
                    <div class="meta-item">
                        <h4>Date <i class="fa fa-calendar" aria-hidden="true"></i></h4>
                      
                        <span class="meta-text dates"></span>
                    </div>
                    <!-- Prep time -->
                    <div class="meta-item">
                        <h4><span>Prep time </span><i class="fa fa-clock" aria-hidden="true"></i></h4><span>
                        <span class="meta-text preptime prep-time-value"></span>
                    </div>
                    <!-- Total time -->
                    <div class="meta-item">
                      
                        <h4><span>Total time </span><i class="fa-solid fa-stopwatch" aria-hidden="true"></i></h4>
                        <span class="meta-text total-time-value"></span>
                    </div>
                   <!-- Likes -->
                    <div class="meta-item">
                        <h4>Likes <i class="fa fa-heart" aria-hidden="true"></i></h4>
                        <span class="meta-text">
                            <button id="like-button" aria-pressed="false" aria-label="Like this recipe">
                                <span id="like-count">0</span> <i class="fa fa-heart" aria-hidden="true"></i>
                            </button>
                           
                        </span>
                    </div>
                </div>
            </section>
            
            <div class="summary">
                <a class="recipe-link" href="#recipe">Skip to the recipe</a>
                <div class="summary-content"></div>
            </div>
            <div class="recipe-videos"></div>
            <div class="lists">
                <div class="checklist-container">
                    <div class="checklistHeader" id="recipe">
                        <h3>Recipe</h3>
                        
                    </div>
                    <ul class="checklist"></ul>
                </div>
                <div class="list-container">
                    <div class="shoppinglist-container hide">
                        <h3>Shopping List</h3>
                        <ul class="shopping-list"></ul>
                    </div>
                </div>
                
            </div>

            <div class="directions">
                <div class="directions-heading"><h3>Directions:</h3></div>
                <ol class="directions-list"></ol>
            </div>

            <div id="community-notes"></div>
        </div>
    </article>
</template>
